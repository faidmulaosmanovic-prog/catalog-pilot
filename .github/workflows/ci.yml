name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalogpilot
          POSTGRES_PASSWORD: catalogpilot
          POSTGRES_DB: catalogpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalogpilot -d catalogpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://catalogpilot:catalogpilot@localhost:5432/catalogpilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migrate database (DB-0+)
        run: pnpm db:migrate

      - name: Database smoke
        run: pnpm db:check

      - name: Unit / integration tests
        run: pnpm test
